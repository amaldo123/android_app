plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace = 'com.app.androidnewsapp'
    compileSdk = 37
    defaultConfig {
        applicationId = "com.app.androidnewsapp"
        minSdk = 24
        targetSdk = 37
        versionCode = 36
        versionName = "6.0.0"
    }
    flavorDimensions = ["app"]
    productFlavors {
        techRadar {
            dimension = "app"
            applicationId = "com.amaldo.techradar"
            versionCode = 1
            versionName = "1.0.0"
        }
        sportsFlash {
            dimension = "app"
            applicationId = "com.amaldo.sportsflash"
            versionCode = 1
            versionName = "1.0.0"
        }
        marketPulse {
            dimension = "app"
            applicationId = "com.amaldo.marketpulse"
            versionCode = 1
            versionName = "1.0.0"
        }
        horizonTravel {
            dimension = "app"
            applicationId = "com.amaldo.horizontravel"
            versionCode = 1
            versionName = "1.0.0"
        }
        dailyDigest {
            dimension = "app"
            applicationId = "com.amaldo.dailydigest"
            versionCode = 1
            versionName = "1.0.0"
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            optimization {
                enable false
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            optimization {
                enable true
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
    }
    bundle {
        storeArchive {
            enable = false
        }
    }
    lint {
        disable 'OldTargetApi', 'GradleDependency', 'GradleDynamicVersion'
    }
}

/* WARNING : Highly recommended to keep the library version
Be careful when update dependencies, different library version may caused error */
dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    //google support library
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.browser:browser:1.9.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.code.gson:gson:2.14.0'

    //Analytics
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'

    //Ad Network Sdk, see the documentation for other Ad Network Sdk options
    implementation 'com.github.solodroid-dev.ads:admob-ads-sdk:2.+'

    //Push notification
    implementation 'com.github.solodroid-dev.push:notification-sdk:1.+'

    //Image Library
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    //Media3 ExoPlayer
    def media3_version = "1.8.0"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-exoplayer-rtsp:$media3_version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
    implementation "androidx.media3:media3-exoplayer-ima:$media3_version"

    //youtube player
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:13.0.0'
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:custom-ui:13.0.0'

    //rest API
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation(platform('com.squareup.okhttp3:okhttp-bom:5.2.1'))
    implementation("com.squareup.okhttp3:okhttp")
    implementation("com.squareup.okhttp3:logging-interceptor")

    //shimmer effect
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    //form validation
    implementation 'com.github.solodroid-id:validation-library:1.0.0'

}