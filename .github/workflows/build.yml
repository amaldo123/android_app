name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Corrupted Wrapper Files
        run: |
          echo "Removing invalid wrapper files..."
          find . -name "gradle-wrapper.jar" -delete || true
          find . -name "gradlew" -delete || true
          find . -name "gradlew.bat" -delete || true

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: android_news_app_6.0.0/android_studio/AndroidNewsApp
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release Bundle (.aab)
        working-directory: android_news_app_6.0.0/android_studio/AndroidNewsApp
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APKs (All 5 Apps)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: all-5-apps-debug-apks
          path: android_news_app_6.0.0/android_studio/AndroidNewsApp/app/build/outputs/apk/**/*.apk

      - name: Upload Release Bundles (All 5 Apps)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: all-5-apps-release-bundles
          path: android_news_app_6.0.0/android_studio/AndroidNewsApp/app/build/outputs/bundle/**/*.aab
