name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup & Repair Gradle Wrapper
        id: prepare-gradle
        run: |
          echo "Locating build.gradle..."
          BUILD_FILE=$(find . -name "build.gradle" -not -path "*/.*" -not -path "*/app/*" | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE=$(find . -name "build.gradle" -not -path "*/.*" | head -n 1)
          fi

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::No build.gradle found in repository!"
            find . -maxdepth 3
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Project directory is: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          # Fix or replace gradlew if it contains XML or is invalid
          GRADLEW_FILE="$PROJECT_DIR/gradlew"
          if [ ! -f "$GRADLEW_FILE" ] || ! grep -q "GRADLE_APP_NAME" "$GRADLEW_FILE" 2>/dev/null; then
            echo "Corrupted or missing gradlew detected! Downloading clean Gradle wrapper script..."
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew -o "$GRADLEW_FILE"
          fi
          chmod +x "$GRADLEW_FILE"

          # Ensure gradle/wrapper directory and jar exist
          WRAPPER_DIR="$PROJECT_DIR/gradle/wrapper"
          mkdir -p "$WRAPPER_DIR"
          if [ ! -f "$WRAPPER_DIR/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar -o "$WRAPPER_DIR/gradle-wrapper.jar"
          fi

          if [ ! -f "$WRAPPER_DIR/gradle-wrapper.properties" ]; then
            echo "Creating default gradle-wrapper.properties..."
            cat << 'EOF' > "$WRAPPER_DIR/gradle-wrapper.properties"
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.prepare-gradle.outputs.project_dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release Bundle (.aab)
        working-directory: ${{ steps.prepare-gradle.outputs.project_dir }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: ${{ steps.prepare-gradle.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk

      - name: Upload Release Bundle (.aab)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-bundle
          path: ${{ steps.prepare-gradle.outputs.project_dir }}/**/build/outputs/bundle/release/*.aab
