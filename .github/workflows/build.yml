name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle CLI
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Locate Android Project & Generate Clean Wrapper
        id: prepare-gradle
        run: |
          echo "Locating build.gradle..."
          BUILD_FILE=$(find . -name "build.gradle" -not -path "*/.*" -not -path "*/app/*" | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE=$(find . -name "build.gradle" -not -path "*/.*" | head -n 1)
          fi

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::No build.gradle found in repository!"
            find . -maxdepth 3
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Project directory is: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          # Generate genuine, complete wrapper files using Gradle CLI
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.2
          chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.prepare-gradle.outputs.project_dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release Bundle (.aab)
        working-directory: ${{ steps.prepare-gradle.outputs.project_dir }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: ${{ steps.prepare-gradle.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk

      - name: Upload Release Bundle (.aab)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-bundle
          path: ${{ steps.prepare-gradle.outputs.project_dir }}/**/build/outputs/bundle/release/*.aab
