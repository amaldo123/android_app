name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Locate Android Project & Gradlew
        id: find-project
        run: |
          echo "Listing repository structure:"
          ls -la

          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::'gradlew' was not found anywhere in the repository!"
            echo "Current files in repository:"
            find . -maxdepth 3
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew at: $GRADLEW_PATH"
          echo "Project directory is: $PROJECT_DIR"

          chmod +x "$GRADLEW_PATH"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release Bundle (.aab)
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: ${{ steps.find-project.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk

      - name: Upload Release Bundle (.aab)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-bundle
          path: ${{ steps.find-project.outputs.project_dir }}/**/build/outputs/bundle/release/*.aab
